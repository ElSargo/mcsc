[package]
name = "mcsc"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "mcsc-server"
path = "src/server.rs"

[[bin]]
name = "mcsc-cli"
path = "src/cli.rs"

[[bin]]
name = "mcsc-gui"
path = "src/gui.rs"

[dependencies]
getrandom = "0.4.3"
hmac = "0.13.0"
iced = { version = "0.14.0", features = ["tokio"] }
prost = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1.17"
toml = "0.9.8"
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
