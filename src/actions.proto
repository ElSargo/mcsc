syntax = "proto3";
package actions;

service Controller {
  rpc Launch   ( LaunchRequest   ) returns ( OpResponse    );
  rpc Stop     ( StopRequest     ) returns ( OpResponse    );
  rpc Command  ( CommandRequest  ) returns ( OpResponse    );
  rpc Download ( DownloadRequest ) returns ( stream WorldDownload );
  rpc Backup   ( BackupRequest   ) returns ( OpResponse    );
}

message AuthToken {
  bytes nonce = 1;
  bytes signature = 2;
  uint64 issued_at_unix_ms = 3;
}

message LaunchRequest {
  AuthToken auth = 1;
}

message StopRequest {
  AuthToken auth = 1;
}

message DownloadRequest{
  AuthToken auth = 1;
}


message BackupRequest {
  AuthToken auth = 1;
}

message CommandRequest{
  string command = 1;
  AuthToken auth = 2;
}
 
enum OpResult{
  Success = 0;
  Fail = 1;
  Denied = 2;
}

message WorldDownload{
  OpResult result = 1;
  string comment = 2;
  bytes data = 3;
  uint64 size = 4;
}


message OpResponse{
  OpResult result = 1;
  string comment = 2;
}

enum AuthAction{
  Launch = 0;
  Stop = 1;
  Command = 2;
  Download = 3;
  Backup = 4;
}
