socket = "127.0.0.1:7878" # Socket to serve on. Use 0.0.0.0 only behind a firewall or VPN.
minecraft_directory = "minecraft" # Minecraft server directory. mcsc switches to this working directory.
backup_directory = "backups" # Folder to store backups in, relative to minecraft_directory.
key = "change-this-to-a-long-random-secret-at-least-32-characters" # Shared secret for request signing.
launch_command = ["sh", "launch.sh"] # Command used to launch the Minecraft server.
allowed_commands = ["list", "say", "save-all", "whitelist"] # First word of console commands allowed through Command.
max_backups = 10
